    <circle cx="32" cy="48.5" r="1.7"/>
    <circle cx="23.75" cy="46.29" r="1.7"/>
    <circle cx="17.71" cy="40.25" r="1.7"/>
    <circle cx="15.5" cy="32" r="1.7"/>
    <circle cx="17.71" cy="23.75" r="1.7"/>
